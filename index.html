<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Binnie</title>
<meta name="description" content="A little photo gallery of our memories together.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="backdrop-glow"></div>

  <header class="site-header">
    <p class="eyebrow">🥂 Cheers to us, wherever we roam</p>
    <h1 class="site-title">For Binnie</h1>
    <p class="site-subtitle">Every trip, every spritz, every silly photo — all in one place.</p>
  </header>

  <main>
    <section id="gallery" class="gallery" aria-label="Photo gallery">
      <!-- Photos are injected here automatically by js/main.js -->
    </section>

    <p id="empty-state" class="empty-state" hidden>
      No photos yet! Add your pictures to the <code>photos</code> folder —
      see the <code>README.md</code> for the two-minute guide. 💛
    </p>
  </main>

  <footer class="site-footer">
    <p>Made with love, one memory at a time.</p>
  </footer>

  <!-- Lightbox -->
  <div id="lightbox" class="lightbox" hidden>
    <button class="lightbox-close" id="lightbox-close" aria-label="Close">&times;</button>
    <button class="lightbox-nav lightbox-prev" id="lightbox-prev" aria-label="Previous photo">&#10094;</button>
    <div class="lightbox-content">
      <img id="lightbox-img" src="" alt="">
      <p id="lightbox-caption" class="lightbox-caption"></p>
      <p id="lightbox-counter" class="lightbox-counter"></p>
    </div>
    <button class="lightbox-nav lightbox-next" id="lightbox-next" aria-label="Next photo">&#10095;</button>
  </div>

  <script src="js/photos-data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
